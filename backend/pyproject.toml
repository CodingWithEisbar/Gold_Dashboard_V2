[build-system]
requires = ["setuptools>=80"]
build-backend = "setuptools.build_meta"

[project]
name = "gold-premium-tracker"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
  "fastapi", "uvicorn", "pydantic-settings", "sqlalchemy>=2", "alembic",
  "psycopg[binary]", "httpx", "tzdata",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = ["postgres: requires TEST_DATABASE_URL pointing to a disposable PostgreSQL database"]

[tool.ruff]
line-length = 110

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "S"]
ignore = ["E501", "B008"]

[tool.ruff.lint.per-file-ignores]
"**/tests/*" = ["S101", "S105", "S106", "S603"]
"**/infra/container_smoke.py" = ["S101", "S603"]
"**/infra/security_gate.py" = ["S603"]

[tool.ruff.lint.isort]
known-first-party = ["app"]
