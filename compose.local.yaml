services:
  frontend:
    ports: ["127.0.0.1:8080:8080"]
  worker:
    depends_on:
      price-browser: {condition: service_healthy, required: false}
    command: [python, -u, -m, app.jobs.collect_hourly]
    environment:
      INVESTING_ENABLED: ${INVESTING_ENABLED:-false}
      SJC_ENABLED: ${SJC_ENABLED:-false}
      DOJI_ENABLED: ${DOJI_ENABLED:-false}
  price-browser:
    image: selenium/standalone-firefox:4.53.0-20261120
    profiles: [price-browser]
    healthcheck:
      test: [CMD, /opt/bin/check-grid.sh, --host, 127.0.0.1, --port, "4444"]
      interval: 10s
      timeout: 10s
      retries: 12
    shm_size: 2gb
    environment:
      TZ: Asia/Ho_Chi_Minh
      SE_NODE_SESSION_TIMEOUT: 90
      SE_SESSION_REQUEST_TIMEOUT: 20
      SE_START_VNC: "false"
      SE_START_NO_VNC: "false"
    restart: unless-stopped
    networks: [outbound]
